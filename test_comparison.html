<!DOCTYPE html>
<html>
<body style="background: #09090b; color: white; font-family: sans-serif; padding: 20px; display: flex; gap: 20px;">
  <div>
    <p>1. Raw AVIF in &lt;img&gt; (Broken Checkerboard)</p>
    <div style="width: 250px; height: 180px; background-color: #121215; background-image: linear-gradient(45deg, #1c1c21 25%, transparent 25%), linear-gradient(-45deg, #1c1c21 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1c1c21 75%), linear-gradient(-45deg, transparent 75%, #1c1c21 75%); background-size: 16px 16px; border: 1px solid #27272a; border-radius: 8px; overflow: hidden;">
      <img src="https://res.cloudinary.com/demo/image/upload/sample.avif" alt="Raw AVIF" style="width: 100%; height: 100%; object-fit: cover;" />
    </div>
  </div>
  <div>
    <p>2. CloudinaryImage with Progressive Delivery (Fixed)</p>
    <div style="width: 250px; height: 180px; background-color: #121215; background-image: linear-gradient(45deg, #1c1c21 25%, transparent 25%), linear-gradient(-45deg, #1c1c21 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1c1c21 75%), linear-gradient(-45deg, transparent 75%, #1c1c21 75%); background-size: 16px 16px; border: 1px solid #27272a; border-radius: 8px; overflow: hidden;">
      <picture style="width: 100%; height: 100%; display: block;">
        <source srcset="https://res.cloudinary.com/demo/image/upload/c_limit,w_600,f_avif,q_auto/sample.avif" type="image/avif" />
        <source srcset="https://res.cloudinary.com/demo/image/upload/c_limit,w_600,f_webp,q_auto/sample.webp" type="image/webp" />
        <img src="https://res.cloudinary.com/demo/image/upload/c_limit,w_600,f_auto,q_auto/sample.jpg" alt="Fixed AVIF" style="width: 100%; height: 100%; object-fit: cover;" />
      </picture>
    </div>
  </div>
</body>
</html>
