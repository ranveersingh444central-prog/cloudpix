<!DOCTYPE html>
<html>
<body style="background: #111; color: white; font-family: sans-serif; padding: 20px;">
  <h2>CloudPix AVIF Picture Component Test</h2>
  <div style="width: 300px; height: 200px; background: #222; border: 1px solid #444; overflow: hidden; border-radius: 8px;">
    <picture style="width: 100%; height: 100%; display: block;">
      <source srcset="https://res.cloudinary.com/demo/image/upload/c_limit,w_600,f_avif,q_auto/sample.avif" type="image/avif" />
      <source srcset="https://res.cloudinary.com/demo/image/upload/c_limit,w_600,f_webp,q_auto/sample.webp" type="image/webp" />
      <img src="https://res.cloudinary.com/demo/image/upload/c_limit,w_600,f_auto,q_auto/sample.jpg" alt="Test" style="width: 100%; height: 100%; object-fit: cover;" />
    </picture>
  </div>
</body>
</html>
